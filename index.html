<style id="app-style">/* Layout : une colonne d'appli mobile (max 480px), héros "halo" plein cadre repris de l'affiche,
   contenu sur crème, barre d'onglets Charcoal fixée en bas. Look unique assumé (pas de mode sombre). */
:root {
  --pomelo: #FF744F;
  --charcoal: #1B0300;
  --blues: #CAE7F7;
  --mocha: #822E13;
  --cream: #FFF8F1;
  --paper: #FFFFFF;
  --ink: #1B0300;
  --ink-soft: rgba(27, 3, 0, .66);
  --line: rgba(27, 3, 0, .12);
  --ember: #E33A0C;
  --on-dark: #FFF8F1;

  --f-voice: "Archivo Black", "Arial Black", "Helvetica Neue", Impact, sans-serif;
  --f-info: "Instrument Sans", "Helvetica Neue", Arial, sans-serif;
  --f-soul: "Instrument Serif", Georgia, "Times New Roman", serif;

  --r: 16px;
  --r-pill: 999px;
  --tabbar-h: 68px;
  color-scheme: light;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { background: var(--charcoal); }
body {
  margin: 0;
  color: var(--ink);
  font-family: var(--f-info);
  font-size: 16px;
  line-height: 1.45;
  -webkit-font-smoothing: antialiased;
}
body::before {
  content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px);
  z-index: 10; background: var(--charcoal);
}
a { color: inherit; }
:focus-visible { outline: 3px solid var(--blues); outline-offset: 2px; border-radius: 6px; }

.app {
  max-width: 480px; margin: 0 auto; min-height: 100vh;
  background: var(--cream);
  padding-bottom: calc(var(--tabbar-h) + env(safe-area-inset-bottom, 0px) + 24px);
  box-shadow: 0 0 0 1px rgba(255,255,255,.04), 0 30px 80px rgba(0,0,0,.5);
  overflow-x: hidden;
}
.wrap {
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}

.hero::after { /* fondu vers le crème */
  content: ""; position: absolute; inset: auto 0 0; height: 28px;
  background: linear-gradient(to bottom, transparent, rgba(27,3,0,.25));
  pointer-events: none;
}
.hero-inner { position: relative; z-index: 1; padding-block: 18px 30px; display: grid; gap: 22px; }
.hero-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.hero-top img { width: 58px; height: auto; display: block; }
.countdown-chip {
  font-family: var(--f-voice); font-size: 15px; letter-spacing: .02em;
  background: var(--charcoal); color: var(--pomelo);
  padding: 7px 14px; border-radius: var(--r-pill);
}
.tagline {
  justify-self: center; margin-top: 18cqi;
  border: 2px solid var(--on-dark); padding: 7px 12px 6px;
  font-family: var(--f-voice); font-size: clamp(13px, 4.4cqi, 20px);
  letter-spacing: -.035em; text-transform: uppercase; white-space: nowrap;
}
.title { position: relative; justify-self: center; text-align: center; margin: 0; line-height: .8; font-weight: 400; }
.title .w1, .title .w2 {
  display: block; font-family: var(--f-voice); color: var(--on-dark);
  letter-spacing: -.055em; text-shadow: 0 6px 24px rgba(60, 0, 0, .25);
}
.title .w1 { font-size: 26.5cqi; }
.title .w2 { font-size: 36.5cqi; margin-top: -.04em; }
.sticker {
  position: absolute; right: -.08em; bottom: -.62em;
  font-family: var(--f-voice); font-size: 15cqi; letter-spacing: -.05em;
  color: var(--pomelo);
  -webkit-text-stroke: .2em var(--on-dark); paint-order: stroke fill;
  text-shadow: 0 4px 0 rgba(27,3,0,.08);
}
.hero-meta { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; margin-top: 12cqi; }
.hero-meta .who { font-size: clamp(15px, 4.6cqi, 21px); line-height: 1.15; letter-spacing: -.02em; }
.hero-meta .who b { font-family: var(--f-voice); font-weight: 400; letter-spacing: -.05em; }
.hero-meta .when { font-family: var(--f-voice); text-align: right; line-height: .92; letter-spacing: -.05em; }
.hero-meta .when span { display: block; font-size: clamp(18px, 6cqi, 28px); }
.hero-meta .when strong { display: block; font-size: clamp(30px, 10cqi, 46px); font-weight: 400; }

/* ---------- Sections communes ---------- */
.view { display: block; }
.view-head { padding-block: 34px 18px; display: grid; gap: 6px; }
.view-head h1 {
  margin: 0; font-family: var(--f-voice); font-weight: 400; text-transform: uppercase;
  font-size: clamp(46px, 15vw, 70px); line-height: .84; letter-spacing: -.055em; text-wrap: balance;
}
.view-head .kicker { font-family: var(--f-soul); font-style: italic; font-size: 24px; line-height: 1.1; color: var(--mocha); }
.view-head p { margin: 6px 0 0; color: var(--ink-soft); max-width: 36ch; }
.back {
  display: inline-flex; align-items: center; gap: 6px; text-decoration: none;
  font-weight: 600; font-size: 14px; color: var(--ink-soft); margin-bottom: 6px;
}
.stack { display: grid; gap: 14px; }
.section-label {
  font-size: 12px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase;
  color: var(--ink-soft); margin: 28px 0 10px;
}
.note {
  display: flex; gap: 10px; align-items: flex-start;
  background: var(--paper); border: 1.5px dashed rgba(130, 46, 19, .45); border-radius: 12px;
  padding: 10px 12px; font-size: 13.5px; color: var(--mocha); line-height: 1.35;
}
.note b { font-weight: 700; }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 48px; padding: 0 20px; border-radius: var(--r-pill); border: 0;
  font-family: var(--f-info); font-weight: 700; font-size: 16px; text-decoration: none; cursor: pointer;
  background: var(--pomelo); color: var(--charcoal);
  transition: transform .15s ease, filter .15s ease;
}
.btn:hover { filter: brightness(1.04); }
.btn:active { transform: scale(.98); }
.btn.dark { background: var(--charcoal); color: var(--pomelo); }
.btn.ghost { background: transparent; color: var(--charcoal); box-shadow: inset 0 0 0 1.5px var(--charcoal); }
.btn.small { min-height: 38px; padding: 0 14px; font-size: 14px; }
.btn[aria-disabled="true"] { opacity: .5; pointer-events: none; }

/* ---------- Accueil ---------- */
.status {
  margin-top: -1px; background: var(--charcoal); color: var(--on-dark);
  border-radius: 0 0 var(--r) var(--r); padding-block: 18px 20px;
}
.status .lbl { font-size: 12px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--pomelo); }
.status .big { font-family: var(--f-voice); font-size: 26px; letter-spacing: -.04em; line-height: 1; margin-top: 6px; }
.status .sub { color: rgba(255, 248, 241, .72); margin-top: 6px; font-size: 15px; }
.status .next { margin-top: 14px; padding-top: 12px; border-top: 1px solid rgba(255,248,241,.14); font-size: 14.5px; color: rgba(255,248,241,.86); }
.status .next b { color: var(--blues); font-weight: 600; }
.cd { display: flex; gap: 8px; margin-top: 12px; }
.cd div { background: rgba(255,248,241,.07); border-radius: 12px; padding: 8px 10px; min-width: 64px; text-align: center; }
.cd strong { display: block; font-family: var(--f-voice); font-size: 26px; line-height: 1; color: var(--pomelo); font-variant-numeric: tabular-nums; font-weight: 400; }
.cd span { font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: rgba(255,248,241,.6); }

.tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 22px; }
.tile {
  position: relative; display: flex; flex-direction: column; justify-content: space-between; gap: 18px;
  min-height: 118px; padding: 14px; border-radius: var(--r); text-decoration: none; overflow: hidden;
}
.tile .t { font-family: var(--f-voice); font-size: 21px; line-height: .95; letter-spacing: -.045em; text-transform: uppercase; }
.tile .d { font-size: 13.5px; line-height: 1.25; opacity: .85; }
.tile svg { width: 26px; height: 26px; }
.tile.reserve { grid-column: 1 / -1; min-height: 132px; background: var(--pomelo); color: var(--charcoal); }
.tile.reserve .t { font-size: 30px; }
.tile.reserve .arrow {
  position: absolute; right: 14px; top: 14px; width: 44px; height: 44px; border-radius: 50%;
  background: var(--charcoal); color: var(--pomelo); display: grid; place-items: center;
}
.tile.reserve .arrow svg { width: 22px; height: 22px; }
.tile.c-dark { background: var(--charcoal); color: var(--on-dark); }
.tile.c-dark .t { color: var(--pomelo); }
.tile.c-blue { background: var(--blues); color: var(--charcoal); }
.tile.c-mocha { background: var(--mocha); color: var(--on-dark); }
.tile.c-paper { background: var(--paper); color: var(--charcoal); box-shadow: inset 0 0 0 1.5px var(--line); }
.row-link {
  grid-column: 1 / -1; display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding: 14px 16px; border-radius: var(--r); background: var(--paper); box-shadow: inset 0 0 0 1.5px var(--line);
  text-decoration: none; font-weight: 600;
}
.row-link small { display: block; font-weight: 400; color: var(--ink-soft); font-size: 13px; }

.verse-card {
  background: var(--blues); border-radius: var(--r); padding: 20px 18px 16px; display: grid; gap: 12px;
}
.verse-card blockquote { margin: 0; font-family: var(--f-soul); font-size: 25px; line-height: 1.16; letter-spacing: -.005em; }
.verse-card .ref { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.verse-card .ref span { font-weight: 700; font-size: 14px; letter-spacing: .02em; }
.verse-card .ref em { font-style: normal; font-size: 12px; color: var(--ink-soft); }
.actions { display: flex; gap: 8px; flex-wrap: wrap; }
.chip-btn {
  display: inline-flex; align-items: center; gap: 6px; min-height: 34px; padding: 0 12px; border-radius: var(--r-pill);
  border: 0; background: rgba(27, 3, 0, .08); color: var(--charcoal); font: 600 13px var(--f-info); text-decoration: none; cursor: pointer;
}
.chip-btn:hover { background: rgba(27, 3, 0, .14); }

.annonces { display: grid; gap: 10px; }
.annonce { display: grid; grid-template-columns: 10px 1fr; gap: 12px; padding: 14px 14px 14px 12px; background: var(--paper); border-radius: 14px; box-shadow: inset 0 0 0 1.5px var(--line); }
.annonce::before { content: ""; width: 10px; height: 10px; border-radius: 50%; background: var(--pomelo); margin-top: 6px; }
.annonce b { display: block; }
.annonce span { color: var(--ink-soft); font-size: 14.5px; }

.foot { display: grid; justify-items: center; gap: 10px; padding-block: 40px 10px; text-align: center; }
.foot .logo-badge { width: 76px; height: 76px; border-radius: 50%; background: var(--pomelo); display: grid; place-items: center; }
.foot .logo-badge img { width: 50px; }
.foot p { margin: 0; font-size: 13px; color: var(--ink-soft); }
.foot .words { font-family: var(--f-soul); font-style: italic; font-size: 20px; color: var(--mocha); }

/* ---------- Planning ---------- */
.days { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; background: var(--paper); padding: 5px; border-radius: var(--r-pill); box-shadow: inset 0 0 0 1.5px var(--line); }
.days button {
  min-height: 44px; border: 0; border-radius: var(--r-pill); background: transparent; cursor: pointer;
  font: 400 15px var(--f-voice); letter-spacing: -.03em; color: var(--charcoal); text-transform: uppercase;
}
.days button[aria-selected="true"] { background: var(--charcoal); color: var(--pomelo); }
.timeline { display: grid; margin-top: 18px; }
.slot { display: grid; grid-template-columns: 58px 1fr; gap: 12px; position: relative; padding-bottom: 14px; }
.slot .time { font-weight: 700; font-variant-numeric: tabular-nums; font-size: 15px; padding-top: 14px; }
.slot .card { background: var(--paper); border-radius: 14px; padding: 12px 14px; box-shadow: inset 0 0 0 1.5px var(--line); display: grid; gap: 6px; min-width: 0; }
.slot .card h3 { margin: 0; font-size: 17px; line-height: 1.2; font-weight: 650; }
.slot .card .meta { font-size: 13.5px; color: var(--ink-soft); }
.slot.is-now .card { box-shadow: inset 0 0 0 2.5px var(--pomelo); }
.slot.is-past { opacity: .5; }
.now-flag { justify-self: start; font-size: 11px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; background: var(--pomelo); color: var(--charcoal); padding: 3px 8px; border-radius: var(--r-pill); }
.tag { justify-self: start; display: inline-block; font-size: 11px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; padding: 3px 8px; border-radius: var(--r-pill); }
.tag.celebration { background: var(--charcoal); color: var(--pomelo); }
.tag.enseignement { background: var(--pomelo); color: var(--charcoal); }
.tag.atelier { background: var(--blues); color: var(--charcoal); }
.tag.repas, .tag.pratique { background: rgba(27, 3, 0, .07); color: var(--charcoal); }
.tag.libre { background: var(--mocha); color: var(--on-dark); }
.slot.celebration .card { background: var(--charcoal); color: var(--on-dark); box-shadow: none; }
.slot.celebration .card .meta { color: rgba(255, 248, 241, .7); }
.slot.celebration .tag.celebration { background: var(--pomelo); color: var(--charcoal); }
.slot.celebration.is-now .card { box-shadow: 0 0 0 3px var(--pomelo); }
.legend { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 14px; }

/* ---------- Ateliers ---------- */
.atelier { background: var(--paper); border-radius: var(--r); box-shadow: inset 0 0 0 1.5px var(--line); overflow: hidden; display: grid; }
.atelier .band { background: var(--blues); padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; gap: 10px; font-weight: 700; font-size: 13.5px; font-variant-numeric: tabular-nums; }
.atelier .body { padding: 14px 16px 16px; display: grid; gap: 8px; }
.atelier h3 { margin: 0; font-size: 20px; line-height: 1.15; font-weight: 650; letter-spacing: -.01em; }
.atelier p { margin: 0; color: var(--ink-soft); font-size: 15px; }
.atelier .who { font-family: var(--f-soul); font-style: italic; font-size: 18px; color: var(--mocha); }
.atelier .foot-row { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; margin-top: 4px; }
.atelier .room { font-size: 13.5px; color: var(--ink-soft); }
.reserve-banner { background: var(--pomelo); border-radius: var(--r); padding: 18px; display: grid; gap: 12px; }
.reserve-banner h2 { margin: 0; font-family: var(--f-voice); font-weight: 400; font-size: 26px; line-height: .95; letter-spacing: -.045em; text-transform: uppercase; }
.reserve-banner p { margin: 0; font-size: 15px; }
.speaker { display: grid; grid-template-columns: 64px 1fr; gap: 14px; align-items: center; background: var(--charcoal); color: var(--on-dark); border-radius: var(--r); padding: 14px; }
.speaker .mono { width: 64px; height: 64px; border-radius: 50%; background: var(--pomelo); color: var(--charcoal); display: grid; place-items: center; font-family: var(--f-voice); font-size: 22px; letter-spacing: -.04em; }
.speaker b { font-family: var(--f-voice); font-weight: 400; font-size: 20px; letter-spacing: -.04em; display: block; }
.speaker span { font-size: 14px; color: rgba(255, 248, 241, .7); }

/* ---------- Plan ---------- */
.map-card { background: var(--paper); border-radius: var(--r); box-shadow: inset 0 0 0 1.5px var(--line); padding: 10px; }
.map-card svg { display: block; width: 100%; height: auto; }
.zones { display: grid; gap: 8px; }
.zone { display: grid; grid-template-columns: 18px 1fr; gap: 12px; align-items: start; padding: 10px 0; border-bottom: 1px solid var(--line); }
.zone i { width: 18px; height: 18px; border-radius: 5px; margin-top: 2px; }
.zone b { display: block; font-weight: 650; }
.zone span { font-size: 14px; color: var(--ink-soft); }
.addr { display: grid; gap: 10px; background: var(--charcoal); color: var(--on-dark); border-radius: var(--r); padding: 16px; margin-top: 18px; }
.addr b { font-family: var(--f-voice); font-weight: 400; font-size: 22px; letter-spacing: -.04em; }
.addr span { color: rgba(255,248,241,.72); font-size: 14.5px; }

/* ---------- Mur ---------- */
.wall-hero { background: var(--charcoal); color: var(--on-dark); border-radius: var(--r); padding: 22px 18px; display: grid; gap: 14px; position: relative; overflow: hidden; }
.wall-hero::before { content: ""; position: absolute; width: 260px; height: 260px; right: -90px; top: -110px; border-radius: 50%; background: radial-gradient(circle, rgba(255,116,79,.75), rgba(255,116,79,0) 68%); }
.wall-hero > * { position: relative; }
.wall-hero q { font-family: var(--f-soul); font-size: 30px; line-height: 1.05; quotes: "« " " »"; }
.wall-hero p { margin: 0; color: rgba(255,248,241,.75); font-size: 15px; }
.wall-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.wall-actions .tile { min-height: 150px; }
.counter { display: flex; gap: 4px; margin-top: 2px; }
.counter i { width: 100%; height: 6px; border-radius: 3px; background: rgba(27,3,0,.18); }
.counter i.on { background: var(--charcoal); }
.rules { display: grid; gap: 0; counter-reset: r; }
.rules li { list-style: none; display: grid; grid-template-columns: 30px 1fr; gap: 10px; padding: 12px 0; border-bottom: 1px solid var(--line); }
.rules li::before { counter-increment: r; content: counter(r); font-family: var(--f-voice); color: var(--pomelo); font-size: 22px; line-height: 1; }
.rules { padding: 0; margin: 0; }

/* ---------- Versets ---------- */
.filters { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 14px; }
.filters button { min-height: 38px; padding: 0 14px; border-radius: var(--r-pill); border: 0; cursor: pointer; font: 600 14px var(--f-info); background: var(--paper); color: var(--charcoal); box-shadow: inset 0 0 0 1.5px var(--line); }
.filters button[aria-pressed="true"] { background: var(--charcoal); color: var(--pomelo); box-shadow: none; }
.verse-card.theme-consecration { background: var(--mocha); color: var(--on-dark); }
.verse-card.theme-consecration .ref em { color: rgba(255,248,241,.7); }
.verse-card.theme-consecration .chip-btn { background: rgba(255,248,241,.14); color: var(--on-dark); }
.verse-card.theme-elevation { background: var(--pomelo); }
.theme-name { font-size: 11px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; opacity: .75; }

/* ---------- Récap ---------- */
.recap-item { background: var(--paper); border-radius: var(--r); box-shadow: inset 0 0 0 1.5px var(--line); padding: 16px; display: grid; gap: 8px; }
.recap-item h3 { margin: 0; font-size: 18px; font-weight: 650; line-height: 1.2; }
.recap-item .when { font-size: 13px; color: var(--ink-soft); font-variant-numeric: tabular-nums; }
.recap-item .pending { font-family: var(--f-soul); font-style: italic; color: var(--mocha); font-size: 18px; }
.recap-item blockquote { margin: 0; font-family: var(--f-soul); font-size: 20px; line-height: 1.2; }
.locked { background: var(--blues); border-radius: var(--r); padding: 18px; display: grid; gap: 6px; }
.locked b { font-family: var(--f-voice); font-weight: 400; font-size: 22px; letter-spacing: -.04em; line-height: 1; }

/* ---------- Barre d'onglets ---------- */
.tabbar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
  padding-bottom: env(safe-area-inset-bottom, 0px);
  padding-left: max(8px, env(safe-area-inset-left, 0px)); padding-right: max(8px, env(safe-area-inset-right, 0px));
  background: var(--charcoal);
}
.tabbar nav { max-width: 480px; margin: 0 auto; height: var(--tabbar-h); display: grid; grid-template-columns: repeat(5, 1fr); }
.tabbar a { display: grid; justify-items: center; align-content: center; gap: 4px; text-decoration: none; color: rgba(255,248,241,.55); font-size: 11.5px; font-weight: 600; }
.tabbar a svg { width: 24px; height: 24px; }
.tabbar a[aria-current="page"] { color: var(--pomelo); }
.tabbar a[aria-current="page"] svg { filter: drop-shadow(0 0 10px rgba(255,116,79,.45)); }

.toast { position: fixed; left: 50%; bottom: calc(var(--tabbar-h) + env(safe-area-inset-bottom, 0px) + 14px); transform: translateX(-50%); background: var(--charcoal); color: var(--on-dark); padding: 10px 16px; border-radius: var(--r-pill); font-size: 14px; font-weight: 600; z-index: 30; box-shadow: 0 8px 24px rgba(0,0,0,.3); }

@media (prefers-reduced-motion: no-preference) {
  .view:not([hidden]) { animation: rise .35s ease both; }
  @keyframes rise { from { transform: translateY(8px); opacity: .6; } to { transform: none; opacity: 1; } }
}

/* ---------- Plan : image réelle ---------- */
.plan-img { display: block; border-radius: 10px; overflow: auto; cursor: zoom-in; }
.plan-img img { display: block; width: 100%; max-width: 100%; height: auto; }
.plan-img.zoom { cursor: zoom-out; }
.plan-img.zoom img { width: 220%; max-width: none; }
.plan-hint { font-size: 12.5px; color: var(--ink-soft); text-align: center; margin-top: 6px; }
.empty { padding: 18px; border-radius: var(--r); background: var(--paper); box-shadow: inset 0 0 0 1.5px var(--line); color: var(--ink-soft); text-align: center; font-size: 15px; }

/* ---------- Admin : accès ---------- */
.fab {
  position: fixed; z-index: 25;
  right: max(16px, env(safe-area-inset-right, 0px));
  bottom: calc(var(--tabbar-h) + env(safe-area-inset-bottom, 0px) + 14px);
  display: inline-flex; align-items: center; gap: 8px; min-height: 46px; padding: 0 18px 0 14px;
  border: 0; border-radius: var(--r-pill); cursor: pointer;
  background: var(--pomelo); color: var(--charcoal); font: 700 15px var(--f-info);
  box-shadow: 0 10px 30px rgba(27,3,0,.35), 0 0 0 3px var(--charcoal);
}
.fab svg { width: 18px; height: 18px; }
.fab .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--charcoal); }
.preview-bar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 15;
  display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap;
  background: var(--pomelo); color: var(--charcoal); padding-block: 10px;
  font-size: 14px; font-weight: 600;
}
.preview-bar .btn { min-height: 36px; font-size: 14px; padding: 0 14px; }

/* ---------- Admin : panneau ---------- */
.admin {
  position: fixed; inset: 0; z-index: 50; overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch;
  background: var(--cream); color: var(--ink);
  padding-top: env(safe-area-inset-top, 0px);
}
.admin-inner { max-width: 640px; margin: 0 auto; padding-bottom: calc(150px + env(safe-area-inset-bottom, 0px)); }
.admin-head {
  position: sticky; top: 0; z-index: 2; background: var(--charcoal); color: var(--on-dark);
  display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 14px;
}
.admin-head h2 { margin: 0; font: 400 24px/1 var(--f-voice); letter-spacing: -.045em; color: var(--pomelo); text-transform: uppercase; }
.admin-head p { margin: 2px 0 0; font-size: 13px; color: rgba(255,248,241,.7); }
.admin-head .btn { min-height: 40px; font-size: 14px; }
.admin-intro { padding-block: 16px 4px; font-size: 15px; color: var(--ink-soft); }
.draft-banner { margin-top: 12px; background: var(--blues); border-radius: 14px; padding: 14px; display: grid; gap: 10px; font-size: 15px; }
.draft-banner .actions { gap: 8px; }

.adm-sec { margin-top: 12px; background: var(--paper); border-radius: var(--r); box-shadow: inset 0 0 0 1.5px var(--line); }
.adm-sec > summary {
  list-style: none; cursor: pointer; display: flex; align-items: center; justify-content: space-between; gap: 10px;
  padding: 16px; font: 400 19px/1 var(--f-voice); letter-spacing: -.04em; text-transform: uppercase;
}
.adm-sec > summary::-webkit-details-marker { display: none; }
.adm-sec > summary::after { content: "+"; font-family: var(--f-info); font-weight: 600; font-size: 22px; color: var(--mocha); }
.adm-sec[open] > summary::after { content: "–"; }
.adm-sec > summary small { font: 600 12px var(--f-info); letter-spacing: .04em; text-transform: none; color: var(--ink-soft); margin-left: auto; }
.adm-body { padding: 0 16px 16px; display: grid; gap: 10px; }
.adm-help { margin: 0; font-size: 13.5px; color: var(--ink-soft); }
.adm-day { border-top: 1px solid var(--line); padding-top: 14px; margin-top: 4px; display: grid; gap: 8px; }
.adm-day-head { display: flex; align-items: flex-end; gap: 8px; }
.adm-day-head .fld { flex: 1; min-width: 0; }
.adm-day-title { font: 400 17px var(--f-voice); letter-spacing: -.03em; text-transform: uppercase; }

.adm-item { border-radius: 12px; background: var(--cream); box-shadow: inset 0 0 0 1.5px var(--line); }
.adm-item.open { box-shadow: inset 0 0 0 2px var(--pomelo); background: var(--paper); }
.adm-row { display: flex; align-items: center; gap: 6px; padding: 6px 6px 6px 4px; }
.adm-sum {
  flex: 1; min-width: 0; text-align: left; border: 0; background: transparent; cursor: pointer; padding: 8px;
  font: 600 15px var(--f-info); color: var(--ink); display: flex; gap: 10px; align-items: baseline;
}
.adm-sum b { font-variant-numeric: tabular-nums; color: var(--mocha); flex: none; }
.adm-sum span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.adm-sum em { font-style: normal; font-weight: 400; color: var(--ink-soft); font-size: 13px; flex: none; }
.adm-acts { display: flex; gap: 4px; flex: none; }
.ibtn {
  width: 36px; height: 36px; border-radius: 10px; border: 0; cursor: pointer; display: grid; place-items: center;
  background: rgba(27,3,0,.06); color: var(--charcoal);
}
.ibtn:hover { background: rgba(27,3,0,.12); }
.ibtn.danger { color: #B42318; }
.ibtn svg { width: 17px; height: 17px; }
.ibtn:disabled { opacity: .3; cursor: default; }
.confirm { display: flex; gap: 6px; align-items: center; font-size: 13px; font-weight: 600; color: #B42318; }
.confirm button { min-height: 34px; padding: 0 10px; border-radius: 9px; border: 0; cursor: pointer; font: 700 13px var(--f-info); }
.confirm .yes { background: #B42318; color: #fff; }
.confirm .no { background: rgba(27,3,0,.08); color: var(--charcoal); }
.adm-form { padding: 4px 12px 14px; display: grid; gap: 10px; }
.adm-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.adm-grid > * { min-width: 0; }
.fld { display: grid; gap: 5px; }
.fld > span { font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-soft); }
.fld input, .fld textarea, .fld select {
  width: 100%; max-width: 100%; min-width: 0; min-height: 44px; padding: 10px 12px; border-radius: 10px; border: 1.5px solid rgba(27,3,0,.2);
  background: var(--paper); color: var(--ink); font: 400 16px var(--f-info);
}
.fld textarea { min-height: 84px; resize: vertical; line-height: 1.4; }
.fld input:focus, .fld textarea:focus, .fld select:focus { outline: none; border-color: var(--pomelo); box-shadow: 0 0 0 3px rgba(255,116,79,.25); }

  /* Le mur Padlet s'affiche dans l'appli quand l'hébergeur autorise l'intégration (GitHub Pages, etc.).

  const CAN_EMBED = location.protocol === "file:" || !/(^|\.)(claude\.ai|claude\.com|anthropic\.com|claudeusercontent\.com)$/i.test(location.hostname);

  function statusHTML(slots) {
    if (!slots.length) return { chip: "Bientôt", html: '<div class="lbl">Programme</div><div class="big">Le planning arrive bientôt</div>' };
    const n = new Date(), first = slots[0], last = slots[slots.length - 1];
    if (n < first.start) {
      const ms = first.start - n;
      const d = Math.floor(ms / 864e5), hh = Math.floor((ms % 864e5) / 36e5), mm = Math.floor((ms % 36e5) / 6e4);
      return { chip: ms > 12 * 36e5 ? "J-" + Math.ceil(ms / 864e5) : "Ce soir",
        html: '<div class="lbl">Bientôt</div><div class="big">Le week-end commence dans</div>' +
          '<div class="cd"><div><strong>' + d + "</strong><span>jours</span></div><div><strong>" + hh + "</strong><span>heures</span></div><div><strong>" + mm + "</strong><span>min</span></div></div>" +
          '<div class="next">Rendez-vous <b>' + esc(first.lab.long.toLowerCase()) + " à " + esc(first.it.h) + "</b> · " + esc(first.it.titre) + "</div>" };
    }
    if (n >= last.end) return { chip: "Merci !", html: '<div class="lbl">C\'est terminé</div><div class="big">Merci pour ce week-end</div><div class="sub">Retrouve le récap des ateliers et des célébrations.</div><div class="next"><a href="#recap" style="color:var(--blues);font-weight:600">Voir le récap ›</a></div>' };
    const c = slots.find((s) => s.start <= n && n < s.end), nx = slots.find((s) => s.start > n);
    return { chip: "En direct",
      html: '<div class="lbl">En ce moment</div><div class="big">' + esc(c ? c.it.titre : "Temps libre") + "</div>" +
        '<div class="sub">' + (c ? esc(c.it.h) + (c.it.lieu ? " · " + esc(c.it.lieu) : "") + (c.it.avec ? " · avec " + esc(c.it.avec) : "") : "") + "</div>" +
        (nx ? '<div class="next">À suivre : <b>' + esc(nx.it.h) + " · " + esc(nx.it.titre) + "</b>" + (nx.it.lieu ? " · " + esc(nx.it.lieu) : "") + "</div>" : "") };
  }
  function refreshStatus() {
    const slots = computeSlots(), st = statusHTML(slots);
    const el = $("#status"), chip = $("#chip"), rs = $("#recap-sub");
    if (el) el.innerHTML = st.html;
    if (chip) chip.textContent = st.chip;

  }

  function viewPlanning(slots) {

      const n = new Date();
      const cur = days.find((j) => { const its = slots.filter((s) => s.jour === j); return its.length && n >= new Date(its[0].start - 6 * 36e5) && n < its[its.length - 1].end; });
      dayId = cur ? cur.id : days[0].id;
    }
    const j = days.find((d) => d.id === dayId), n = new Date();
    const items = slots.filter((s) => s.jour === j);
    return '<section class="view wrap" data-route="planning" hidden>' +
      '<div class="view-head"><span class="kicker">trois jours pour se lever</span><h1>Planning</h1></div>' +

  async function publishNow() {
    if (!art || publishing || !isDirty()) return;
    publishing = true; publishError = ""; saveDraft();
    if (adminOpen) renderAdmin(); else renderApp();
    try {
      await art.publish(buildDocument(S));

      const c = e && e.code;
      if (c === "conflict") publishError = "Une autre version vient d'être publiée. La page se recharge ; tes modifications restent en brouillon sur cet appareil.";
      else if (c === "not_writer" || c === "not_granted" || c === "consent_required" || c === "capability_disabled" || c === "not_declared" || c === "capability_removed") { publishError = "Ce compte ne peut pas publier cette page. Connecte-toi avec le compte propriétaire."; }
      else if (c === "too_large") publishError = "La page est trop lourde. Utilise une image du plan plus légère.";
      else if (c === "rate_limited") publishError = "Trop de publications d'affilée. Attends une minute puis réessaie.";
      else publishError = "La publication n'a pas abouti. Vérifie ta connexion et réessaie.";
      publishing = false;
      if (adminOpen) renderAdmin(); else { renderApp(); toast(publishError); }
    }
  }

  function loadPlanImage(file) {
    if (!file) return;
    const r = new FileReader();
    r.onload = () => {
      const img = new Image();
      img.onload = () => {
        const max = 1600, k = Math.min(1, max / Math.max(img.width, img.height));
        const c = document.createElement("canvas");
        c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
        const x = c.getContext("2d"); x.fillStyle = "#fff"; x.fillRect(0, 0, c.width, c.height); x.drawImage(img, 0, 0, c.width, c.height);
        S.lieu.planImage = c.toDataURL("image/jpeg", 0.82);
        changed(true);
      };
      img.onerror = () => toast("Cette image n'a pas pu être lue. Essaie un JPG ou un PNG.");
      img.src = r.result;
    };
    r.readAsDataURL(file);
  }

    }
    if (t.hasAttribute("data-admin-open")) { adminOpen = true; renderApp(); return; }
    if (t.hasAttribute("data-admin-close")) { adminOpen = false; pendingDel = null; renderApp(); return; }
    if (t.hasAttribute("data-publish")) { publishNow(); return; }
    if (t.hasAttribute("data-export")) {
      dl.save({ filename: "index.html", data: buildDocument(PUBLISHED) })
        .then(() => toast("Fichier enregistré. Envoie-le dans le dépôt GitHub."), () => toast("Téléchargement annulé."));
      return;
    }
    if (d.toggle) { if (openItems.has(d.toggle)) openItems.delete(d.toggle); else openItems.add(d.toggle); pendingDel = null; renderAdmin(); return; }
    if (d.del) { pendingDel = d.del; renderAdmin(); return; }
    if (t.hasAttribute("data-del-no")) { pendingDel = null; renderAdmin(); return; }
    if (d.delYes) {
      const [lp, id] = d.delYes.split("|"); const list = getPath(lp);
      const i = list.findIndex((x) => x.id === id); if (i > -1) list.splice(i, 1);
      if (lp === "ateliers" || lp.indexOf(".items") > -1) delete S.recap[id];
      pendingDel = null; changed(true); return;
    }
    if (d.move) {
      const [lp, si, sd] = d.move.split("|"); const list = getPath(lp), i = +si, j = i + +sd;
      if (j >= 0 && j < list.length) { const tmp = list[i]; list[i] = list[j]; list[j] = tmp; changed(true); }
      return;
    }
    if (d.add) { const it = newItem(d.add); getPath(d.add).push(it); if (d.add !== "jours") openItems.add(it.id); changed(true); return; }
    if (t.hasAttribute("data-plan-remove")) { S.lieu.planImage = ""; changed(true); return; }
    if (t.hasAttribute("data-revert")) { pendingDel = "__revert"; renderAdmin(); return; }
    if (t.hasAttribute("data-revert-yes")) { S = clone(PUBLISHED); pendingDel = null; openItems.clear(); changed(true); return; }
    if (t.hasAttribute("data-draft-use")) { S = draftOffer; draftOffer = null; changed(true); return; }
    if (t.hasAttribute("data-draft-drop")) { draftOffer = null; try { localStorage.removeItem(DRAFT_KEY); } catch (_) {} renderAdmin(); return; }
  });

  function renderPlanningOnly() { const v = $('.view[data-route="planning"]'); if (!v) return; const tmp = document.createElement("div"); tmp.innerHTML = viewPlanning(computeSlots()); const nv = tmp.firstElementChild; nv.hidden = v.hidden; v.replaceWith(nv); }
  function renderVersetsOnly() { const v = $('.view[data-route="versets"]'); if (!v) return; const tmp = document.createElement("div"); tmp.innerHTML = viewVersets(); const nv = tmp.firstElementChild; nv.hidden = v.hidden; v.replaceWith(nv); }

  /* ---------- Démarrage ---------- */
  renderApp();
  setInterval(() => { refreshStatus(); if (!$('.view[data-route="planning"]').hidden) renderPlanningOnly(); }, 30000);

  (async () => {
    if (!window.claude || typeof window.claude.use !== "function") return;
    try {
      art = await window.claude.use("artifact");
      const user = await window.claude.use("user");
      canAdmin = !!(art && user && (await user.canEdit()));
      if (canAdmin) dl = await window.claude.use("downloads");
    } catch (_) { canAdmin = false; }
    if (!canAdmin) return;
    try {
      const raw = localStorage.getItem(DRAFT_KEY);
      if (raw && raw !== PUBLISHED_STR) draftOffer = JSON.parse(raw); else if (raw) localStorage.removeItem(DRAFT_KEY);
    } catch (_) { draftOffer = null; }
    renderApp();
  })();
})();
</script>
</body></html>
